apiVersion: v1
kind: Pod
metadata:
  name: media
  labels:
    app: media
    servicebay.role: media
  annotations:
    servicebay.label: "Movies & TV"
    servicebay.schema-version: "8"
    # #2727 — media ships no v2→v3 migration and never will: what moved on
    # disk between those two versions is no longer reconstructable. The chain
    # is unbroken from v3 up, so v3 is the oldest version this template can be
    # upgraded FROM. A box below it is refused up front, by name and version,
    # instead of aborting mid-job on a missing script.
    servicebay.min-upgradable-schema-version: "3"
    # Jellyfin's public URL routes through nginx, and its LDAP-Auth
    # plugin binds LLDAP from the `auth` stack — both prerequisites.
    # (#1725: Audiobookshelf retired for fresh installs; audiobooks are
    # served by Jellyfin's /media/audiobooks library now.)
    servicebay.dependencies: "nginx,auth"
    servicebay.ports: "{{JELLYFIN_PORT}}/tcp"
    # #1731: Disable SELinux relabelling on jellyfin's bind mounts. The
    # /media mount points at the SHARED, multi-writer file-share/data tree
    # (samba/syncthing/filebrowser/disk-import all write there). The default
    # kube recursive relabel walks that whole tree calling `lsetxattr` on
    # every entry — and a single root-owned stray (e.g. left by disk-import's
    # privileged `sudo mkdir`, #1713) makes the rootless `core` relabel fail
    # `operation not permitted`, crash-looping the entire media pod on a
    # routine stop/start. The shared tree already carries `container_file_t`
    # from its other (long-lived) consumers, so Jellyfin's read-only mount
    # needs no relabel — disabling it is correct, not a workaround. Same
    # per-container disable pattern file-share itself uses. (cf.
    # feedback_hermes_config_bak_selinux: a root-owned stray in a shared
    # tree is a relabel footgun.)
    io.podman.annotations.label/jellyfin: "disable"
    # Continuous health probe (#628). Jellyfin's /System/Info/Public
    # returns 200 once the server is up; it's the only container in the
    # pod now, so pod-up == Jellyfin-up. #618's UserManager-init race is
    # gated by post-deploy.py's own retry loop, not by this probe.
    servicebay.healthcheck: |
      url: http://localhost:{{JELLYFIN_PORT}}/System/Info/Public
      interval: 30s
      timeout: 5s
      startup_timeout: 5m
spec:
  # #817: Media runs in its own network namespace (no hostNetwork) so a
  # compromised jellyfin container can't reach the host's other service
  # ports or the ServiceBay control API.
  #   - Jellyfin is published to the host via `hostPort` on its container
  #     port below; nothing else in the pod is LAN-reachable.
  #   - The `hostAliases` entry pins auth.<PUBLIC_DOMAIN> to
  #     HOST_GATEWAY_IP (podman's `host.containers.internal`) so any
  #     server-side call to Authelia from inside the pod resolves —
  #     an isolated container's resolver doesn't apply AdGuard's
  #     `*.PUBLIC_DOMAIN → LAN IP` rewrite, and a rootless-podman pod
  #     can't reach the host's own LAN IP (#817).
  #   - post-deploy.py runs in the host netns (not the pod), so its
  #     `127.0.0.1:9091` Authelia probe and `127.0.0.1:<JELLYFIN_PORT>`
  #     Jellyfin probe keep working — the latter via the hostPort.
  #   - #1725/#1730: Audiobookshelf fully retired. This pod no longer runs
  #     ABS and the `audiobookshelf` OIDC client is dropped. On an upgrade
  #     the v5→v6 migration tears down the now-orphaned
  #     `media-audiobookshelf` container (left `Up` by #1725, which only
  #     stopped *shipping* it in the pod) but leaves its
  #     {{DATA_DIR}}/media/audiobookshelf-* data dirs untouched on disk
  #     (non-destructive). Audiobooks are served by Jellyfin's
  #     /media/audiobooks library (registered in post-deploy.py).
  #   - #2561 (v7): the transitional `books.<domain>` alias is gone. v6 had
  #     repointed it at Jellyfin so operators kept the familiar address;
  #     that arrangement is over. Jellyfin has exactly ONE hostname now,
  #     `{{MEDIA_SUBDOMAIN}}.{{PUBLIC_DOMAIN}}` — the only `type: subdomain`
  #     variable this template declares, so a deploy can only ever create
  #     that one proxy host. The v6→v7 migration removes the leftover alias
  #     on boxes that still have it.
  hostAliases:
    - ip: "{{HOST_GATEWAY_IP}}"
      hostnames:
        - "auth.{{PUBLIC_DOMAIN}}"
  containers:
  # Jellyfin — Music + audiobooks + (future) video, with Quick Connect for
  #    Symfonium/Findroid/Streamyfin etc. Quick Connect is the practical
  #    SSO answer for Subsonic-style apps: web-confirm a 6-digit code
  #    that the mobile app shows, no shared passwords. Web-UI itself
  #    runs against Jellyfin's own user DB by default — operators can
  #    install jellyfin-plugin-sso (manual, Jellyfin Settings →
  #    Plugins → Repositories) for Authelia-redirect SSO later if
  #    they want; not on by default because the SSO plugin is
  #    community-maintained and install is interactive.
  - name: jellyfin
    image: docker.io/jellyfin/jellyfin:latest
    env:
      - name: TZ
        value: "{{TZ}}"
      - name: JELLYFIN_PublishedServerUrl
        value: "https://{{MEDIA_SUBDOMAIN}}.{{PUBLIC_DOMAIN}}"
      # `unevaluated` keeps Jellyfin from inserting its own privileged
      # nginx-style restart logic; we manage the unit via Quadlet.
    ports:
      - containerPort: {{JELLYFIN_PORT}}
        hostPort: {{JELLYFIN_PORT}}
    # GPU passthrough (CDI) — #2580. Jellyfin transcodes in SOFTWARE
    # unless it gets the card, which cost ~3 of 6 cores for a single
    # stream on the reference box while an idle RTX sat next to it.
    #
    # This block is inert on its own and kept for documentation + as the
    # signal post-deploy.py reads: `podman kube play` on rootless 5.x
    # silently drops every `resources.limits` key outside cpu/memory, so
    # a `.kube` deploy comes up healthy and still runs on CPU (#1026,
    # class documented as #2517). The passthrough that actually works is
    # post-deploy.py's `install_gpu_quadlet_fallback()`, which swaps this
    # service to a `.container` Quadlet carrying
    # `AddDevice=nvidia.com/gpu=all` + `SecurityLabelDisable=true` — the
    # second line is required, not cosmetic: without it the container
    # sees the devices but NVML fails to init under SELinux.
    #
    # Hosts with no CDI-registered NVIDIA GPU are unaffected: the swap is
    # gated on `/etc/cdi/nvidia.yaml`, so the service stays a plain
    # `.kube` pod and Jellyfin keeps transcoding on the CPU.
    #
    # Deliberately NO VRAM budget and NO cap on concurrent transcodes —
    # the operator was shown the numbers (16380 MiB total, ~5900 MiB held
    # by the Solaris inference stack, ~10 GiB free) and chose the plain
    # form on 2026-08-17. Don't add a limit here without reopening #2580.
    {{#JELLYFIN_GPU_PASSTHROUGH}}
    resources:
      limits:
        nvidia.com/gpu: "1"
    {{/JELLYFIN_GPU_PASSTHROUGH}}
    volumeMounts:
      - mountPath: /config
        name: jellyfin-config
      - mountPath: /cache
        name: jellyfin-cache
      - mountPath: /media
        name: jellyfin-media
        readOnly: true

  volumes:
  - name: jellyfin-config
    hostPath:
      path: {{DATA_DIR}}/media/jellyfin-config
      type: DirectoryOrCreate
  - name: jellyfin-cache
    hostPath:
      path: {{DATA_DIR}}/media/jellyfin-cache
      type: DirectoryOrCreate
  - name: jellyfin-media
    hostPath:
      path: {{JELLYFIN_MEDIA_PATH}}
      type: DirectoryOrCreate

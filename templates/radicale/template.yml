apiVersion: v1
kind: Pod
metadata:
  name: radicale
  labels:
    app: radicale
  annotations:
    servicebay.label: "Calendar & Contacts"
    servicebay.schema-version: "3"
    servicebay.ports: "{{RADICALE_PORT}}/tcp"
    # caldav.<domain> goes through nginx; auth is the SSO front.
    servicebay.dependencies: "nginx,auth"
    # Continuous health probe (#628). Radicale's `/` root returns the
    # web client — 200 once the HTTP listener accepted the config.
    servicebay.healthcheck: |
      url: http://localhost:{{RADICALE_PORT}}/
      interval: 30s
      timeout: 5s
      startup_timeout: 5m
spec:
  # #817: Radicale runs in its own network namespace (no hostNetwork) so
  # a compromised container can't reach the host's other service ports
  # or the ServiceBay control API.
  #   - Radicale's HTTP port is published to the host via `hostPort` on
  #     the container port below.
  #   - Radicale binds LLDAP for user lookup over LDAP. LLDAP lives in
  #     the `auth` pod (still hostNetwork), so it listens on the host —
  #     an isolated Radicale pod can't reach it on 127.0.0.1, nor on the
  #     host's own LAN IP (rootless podman refuses both). It reaches the
  #     host via `host.containers.internal`, the name podman puts in
  #     every container's /etc/hosts — that's the `ldap_uri` target
  #     below. Radicale does no OIDC, so no auth.<domain> hostAliases.
  initContainers:
  # Seed /config/config in-pod, every deploy. Earlier versions wrote a
  # config.mustache to the host bind-mount during the wizard's deploy
  # step, which was fragile: any failure in the wizard's path resolver
  # or the agent's write_file call left radicale starting with no config
  # and crash-looping with `[Errno 2] /config/config not found`. By
  # carrying the rendered config inside the pod manifest itself, every
  # `podman play kube` re-creates it deterministically — there's
  # nothing host-side that can drift.
  - name: write-config
    image: docker.io/tomsquest/docker-radicale:latest
    command: ["/bin/sh", "-c"]
    args:
      - |
        cat > /config/config <<'EOF'
        [server]
        hosts = 0.0.0.0:{{RADICALE_PORT}}
        max_connections = 20
        max_content_length = 100000000

        [encoding]
        request = utf-8
        stock = utf-8

        [auth]
        type = ldap
        ldap_uri = ldap://host.containers.internal:{{LLDAP_LDAP_PORT}}
        ldap_base = ou=people,{{LLDAP_BASE_DN}}
        ldap_reader_dn = uid=admin,ou=people,{{LLDAP_BASE_DN}}
        ldap_secret = {{LLDAP_ADMIN_PASSWORD}}
        ldap_filter = (&(objectClass=person)(uid={0}))
        ldap_user_attribute = uid

        [storage]
        type = multifilesystem
        filesystem_folder = /data/collections

        [rights]
        # Ruleset lives in /config/rights, written by the second heredoc
        # below. `owner_only` (the old value) cannot express the one
        # cross-principal grant the household needs (#2411), and the
        # equivalent of it is re-expressed as the [root]/[owner] rules there.
        type = from_file
        file = /config/rights

        [web]
        type = internal

        [logging]
        level = info
        EOF
        # The rights ruleset, seeded here for the same reason as the config
        # above: it is part of the pod manifest, so every `podman kube play
        # --replace` re-creates it. Kept as a live-patched file on the box it
        # was silently reverted to `owner_only` every time AutoUpdate=registry
        # pulled a new image and re-rendered the unit from the template
        # (#2411). Radicale's from_file contract: first matching section
        # wins; `{0}` is the first capture group of that section's `user`
        # pattern; upper-case permissions apply to plain collections,
        # lower-case to calendar/address-book collections and their items.
        cat > /config/rights <<'EOF'
        # Any authenticated user may READ the root collection, so
        # /.well-known/{caldav,carddav} -> `/` principal discovery keeps
        # working. This is what the built-in `owner_only` module returns for
        # the root path.
        [root]
        user: (.+)
        collection:
        permissions: R

        # Owner-only base: every authenticated user has full read/write over
        # their OWN principal subtree - and nothing else. (Equivalent to the
        # built-in `owner_only` module.)
        [owner]
        user: (.+)
        collection: {0}(/.*)?
        permissions: RrWw

        # The `solaris` service account may ADDITIONALLY read/write ONLY the
        # `solaris` calendar under ANY resident's principal - the per-resident
        # calendar the deadlines/tasks sync writes. It reaches
        # `<resident>/solaris` + its items, but NOT the resident's other
        # calendars nor the principal root: no shared password, no broad
        # access.
        [solaris-subcal]
        user: solaris
        collection: [^/]+/solaris(/.*)?
        permissions: RrWw

        # Same deal for contacts: the CardDAV address book that sync writes
        # per resident lives at `<resident>/solaris-contacts` (#2411). Without
        # this the account had nowhere to put an address book - the calendar
        # rule matches `.../solaris` exactly, a calendar is a leaf so nothing
        # nests under it, and the account's own `/solaris/...` tree is exactly
        # the one the resident may not read.
        # Deliberately a second rule rather than widening the pattern above to
        # `solaris(-[a-z]+)?`: every collection this service account may touch
        # is then named explicitly, and `<resident>/solaris-<anything-else>`
        # stays a 403.
        [solaris-contacts]
        user: solaris
        collection: [^/]+/solaris-contacts(/.*)?
        permissions: RrWw
        EOF
    volumeMounts:
      - mountPath: /config
        name: radicale-config
  containers:
  - name: radicale
    image: docker.io/tomsquest/docker-radicale:latest
    # We DO NOT override command: or args:. Each previous attempt to do
    # so broke differently:
    #   PR #164  command:[dumb-init,--,radicale] → "dumb-init not found
    #            in PATH" (K8s command: doesn't carry the image's PATH).
    #   PR #178  args:[radicale,--config=…]      → "radicale: not found"
    #            (entrypoint.sh's PATH excludes the user-pip install loc).
    #
    # The image's full default chain is
    #   dumb-init -- /usr/local/bin/entrypoint.sh radicale
    # which Just Works because the image was built with the right PATH
    # and the right user. Don't fight it. Pass the config path via env
    # var instead — radicale reads RADICALE_CONFIG natively.
    env:
      - name: RADICALE_CONFIG
        value: /config/config
    ports:
      # Bind the published DAV port to the host LOOPBACK only (#2357).
      # Without `hostIP` podman publishes on 0.0.0.0, so Radicale's HTTP
      # API (household calendars + address books) is reachable directly
      # on the LAN at <lan-ip>:{{RADICALE_PORT}}, bypassing the nginx
      # reverse proxy that fronts caldav.<domain> (TLS + single entry
      # point). nginx runs on hostNetwork, so it still reaches this port
      # via 127.0.0.1 — the `loopbackOnly: true` flag on
      # RADICALE_SUBDOMAIN (variables.json) points the proxy target at
      # 127.0.0.1:{{RADICALE_PORT}} accordingly.
      - containerPort: {{RADICALE_PORT}}
        hostPort: {{RADICALE_PORT}}
        hostIP: 127.0.0.1
    volumeMounts:
      - mountPath: /data
        name: radicale-data
      - mountPath: /config
        name: radicale-config
        readOnly: true
  volumes:
  - name: radicale-data
    hostPath:
      path: {{DATA_DIR}}/radicale/data
      type: DirectoryOrCreate
  # /config is an in-pod ephemeral volume populated by the initContainer
  # on every deploy. Radicale's runtime state lives on /data (host bind
  # mount above), so nothing important is lost when /config is recreated.
  - name: radicale-config
    emptyDir: {}

apiVersion: v1
kind: Pod
metadata:
  name: beets
  labels:
    app: beets
    servicebay.role: media
  annotations:
    servicebay.label: "Beets (Music Tagger)"
    # v2 (#2581): supersedes the hand-rolled LOCAL template that shipped
    # this service before. See CHANGELOG.md — the bump exists so an
    # operator upgrading off that local copy sees the breaking-change
    # acknowledgement, and so migrations/v1-to-v2.py runs.
    # v3 (#2584): adds the `coverage` sidecar below and its loopback port.
    servicebay.schema-version: "3"
    # BEETS_PORT first — it is the consumer-facing one (see
    # readPrimaryTcpPort in lib/network/service.ts). The coverage port is
    # bound to the host loopback only; nothing on the LAN talks to it.
    servicebay.ports: "{{BEETS_PORT}}/tcp,{{BEETS_COVERAGE_PORT}}/tcp"
    # The music/audiobook trees this pod mounts are file-share's data
    # volume, so file-share must be installed and settled first.
    servicebay.dependencies: "file-share"
    # Continuous health probe (#628). `beet web`'s /stats returns
    # `{"items": N, "albums": M}` — a 200 there proves more than "the
    # process is up": it proves the web plugin loaded AND the library
    # database opened. A pod that starts but can't read its DB answers
    # 500 here. post-deploy.py registers a SECOND, stricter check
    # (`beets-library-populated`) against the `coverage` sidecar below,
    # which compares the library against the files on disk — see that
    # container for why the assertion had to move out of a body regex
    # (#2584). Keeping the two apart matters: this annotation gates
    # install settleWait, and a fresh install legitimately has an empty
    # library.
    servicebay.healthcheck: |
      url: http://localhost:{{BEETS_PORT}}/stats
      interval: 60s
      timeout: 5s
      startup_timeout: 5m
    # Disable SELinux relabelling on this pod's bind mounts, for exactly
    # the reason templates/media/template.yml documents: /music and
    # /audiobooks point INTO the shared, multi-writer
    # file-share/data tree. The default kube recursive relabel walks that
    # whole tree calling `lsetxattr` on every entry, and one root-owned
    # stray makes the rootless relabel fail `operation not permitted` and
    # crash-loop the pod on a routine restart. The tree already carries
    # `container_file_t` from its long-lived consumers.
    io.podman.annotations.label/beets: "disable"
spec:
  # ADR 0007: beets runs in its own network namespace — no `hostNetwork`.
  # It is not on the closed carve-out list and has no reason to be: it
  # talks to nothing over the network except its own web UI, and it
  # reaches the music through a bind mount, not a socket. The web UI is
  # published to the host with a plain `hostPort` below.
  #
  # Deliberately LAN-only: NO `type: subdomain` variable, no nginx/auth
  # dependency, no public hostname. `beet web` ships with no
  # authentication of any kind — the only thing standing between a
  # request and the library would be Authelia forward-auth on the proxy
  # host, and this UI fronts a service that can rewrite a music
  # collection. A music tagger has no business being reachable from
  # outside the house, so it is reachable from the LAN and nowhere else.
  # (The seeded config also pins `web.readonly: true` — see below.)
  initContainers:
  # Seed /config/config.yaml ONLY when there isn't one, before beets
  # starts. Two reasons this is an initContainer rather than a companion
  # `config.yaml.mustache` or a host-side write in post-deploy.py:
  #
  #   1. A `*.mustache` config file is re-rendered and written on EVERY
  #      deploy, unconditionally. beets' config is a file operators tune
  #      by hand (plugins, an AcoustID key, a `paths:` scheme), so
  #      overwriting it on redeploy would silently discard their work —
  #      and ADR 0004 says installs are non-destructive.
  #   2. post-deploy.py runs AFTER the unit is up, which loses a race the
  #      base image actually wins: started with an empty /config, this
  #      image writes its OWN default config and beets is already serving
  #      on it before post-deploy gets a turn (verified by running the
  #      image bare — it opens `/config/musiclibrary.blb`, its default
  #      library path, not ours). An initContainer runs before the beets
  #      container exists, so the `test -e` answer is the real one, and
  #      the image then leaves the file we wrote alone.
  #
  # Idempotent by construction: existing file → touch nothing. The
  # defaults it writes are the safety property this template promises —
  # `copy: false` + `move: false` means an import writes tags into the files
  # where they already are and never relocates or renames them. No
  # `paths:` scheme is seeded for the same reason.
  - name: seed-config
    image: docker.io/linuxserver/beets:latest
    # Same UID-0 reasoning as the beets container below — /config is a
    # host bind mount owned by the rootless podman user.
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    command: ["/bin/sh", "-c"]
    args:
      - |
        if [ -e /config/config.yaml ]; then
          echo "beets: /config/config.yaml already exists — leaving it untouched."
          echo "beets: (post-deploy.py checks it for move/copy settings and warns.)"
          exit 0
        fi
        echo "beets: no /config/config.yaml — seeding safe defaults."
        cat > /config/config.yaml <<'EOF'
        # Seeded by ServiceBay's beets template on first deploy.
        # Yours to edit — this file is written only when it does not exist.
        # Booleans are spelled true/false rather than beets' more common
        # yes/no: both mean the same thing to beets' YAML 1.1 parser, but
        # yes/no is a plain STRING to a YAML 1.2 parser, so the safety
        # settings below cannot be misread by whatever else looks at this file.
        directory: /music
        library: /config/musiclibrary.db

        plugins:
          - web

        web:
          host: 0.0.0.0
          # Fixed: the pod publishes this on the host via hostPort, so the
          # host-side port can be changed without touching this file.
          port: 8337
          # This UI has no login of any kind. Keep it a browser, not an editor.
          readonly: true

        import:
          # SAFETY — the whole point. beets writes tags into the files where
          # they already are and never copies, moves or renames them. There is
          # deliberately no `paths:` scheme here: with copy+move off it would
          # do nothing, and its presence invites turning move back on.
          copy: false
          move: false
          write: true
          # With `beet import -q`, apply only confident matches and SKIP
          # anything ambiguous rather than guessing at it.
          quiet_fallback: skip
          # Re-runs only look at directories not already imported.
          incremental: true
        EOF
    volumeMounts:
      - mountPath: /config
        name: beets-config
  containers:
  - name: beets
    # Same image reference the pre-v2 local template used, deliberately:
    # switching registries (lscr.io) on an in-place takeover would force a
    # fresh pull and re-point AutoUpdate=registry for no benefit.
    image: docker.io/linuxserver/beets:latest
    # Run as container UID 0. Under rootless podman that maps to the host
    # user running podman (`core`, uid 1000), which OWNS the file-share
    # data tree — the same reasoning file-share's own filebrowser/samba
    # containers document. The pre-v2 local template used PUID/PGID 1000,
    # which maps to a sub-UID (subuid base + 999) with NO write access to
    # `core`-owned music files: beets could not have written a single tag
    # even if an import had ever been triggered. This is the third half of
    # the #2581 bug and the reason v1-to-v2.py has to re-own /config.
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    env:
      - name: TZ
        value: "{{TZ}}"
      # The linuxserver entrypoint runs `usermod` from these; keeping them
      # at 0 stops s6 from dropping back to uid 1000 after the
      # securityContext above put us at 0 (same trap file-share's
      # syncthing container documents).
      - name: PUID
        value: "0"
      - name: PGID
        value: "0"
      # beets reads its config + library from $BEETSDIR. Setting it
      # explicitly means an operator's `podman exec` (the documented way to
      # trigger an import) picks up the same config the web UI uses,
      # without having to pass `-c` every time.
      - name: BEETSDIR
        value: "/config"
    ports:
      # The container side is FIXED at 8337 — it must agree with the
      # `web.port` in /config/config.yaml, which post-deploy.py seeds and
      # the operator may have carried over. BEETS_PORT is purely the
      # host-side publication, so an operator can move the service off
      # 8337 on the LAN without editing beets' own config.
      #
      # No `hostIP` (unlike radicale's loopback bind): there is no reverse
      # proxy in front of this, so binding loopback-only would make the UI
      # unreachable from the operator's laptop — i.e. exactly the #2581
      # symptom, reintroduced.
      - containerPort: 8337
        hostPort: {{BEETS_PORT}}
    volumeMounts:
      - mountPath: /config
        name: beets-config
      # Read-WRITE, unlike jellyfin's /media mount. Writing tags into the
      # files in place IS the job. What it will never do on a fresh
      # install is move or rename them — `import.copy: false` +
      # `import.move: false` in the seeded config, see README.md.
      - mountPath: /music
        name: music-data
      - mountPath: /audiobooks
        name: audiobooks-data
  # ── Library-coverage endpoint (#2584) ────────────────────────────────
  #
  # The check that is supposed to say "beets isn't doing its job" asked a
  # question it could not express. ServiceBay's HTTP check is
  # status-code + body-regex, and `beet web`'s /stats answers only
  # `{"albums": M, "items": N}` — so the strongest thing a regex over that
  # body can assert is "N is at least 1". On a 27k-file collection with 485
  # items in the library that reads GREEN: the exact state the check was
  # invented to catch (#2581 → #2584).
  #
  # Extending the check machinery does not fix it. The missing number is the
  # DENOMINATOR — how many audio files are on disk — and that lives on the
  # box's filesystem, not in the response. A body-comparison operator (or a
  # baked-in item floor) would have to hard-code a count that ages into a lie
  # the moment the operator adds an album. So the assertion moves to the one
  # place where both numbers exist at once: inside the pod, which already
  # mounts /music and can ask beets for its item count over the shared pod
  # netns. This sidecar publishes the RATIO and answers 200/503 against a
  # percentage floor; the registered check goes back to being a plain
  # status-code check, and stays honest at any collection size.
  #
  # Loopback-bound on purpose: the only consumer is ServiceBay's health
  # probe, which runs on the host (same reasoning as radicale's DAV port,
  # #2357). It walks the music tree, so it has no business on the LAN.
  - name: coverage
    # The beets image itself — beets IS a Python app, so the interpreter is
    # already there and this costs no second image pull. `command` replaces
    # the linuxserver s6 entrypoint, so no PUID/PGID dance applies here.
    image: docker.io/linuxserver/beets:latest
    # Same UID-0 mapping as the beets container: under rootless podman that
    # is the host user that owns the music tree. UID 1000 could not even
    # READ it (see the beets container above).
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    env:
      - name: TZ
        value: "{{TZ}}"
      # The floor the ratio is held to. A PERCENTAGE, deliberately: it keeps
      # meaning the same thing when the collection doubles, which a fixed
      # item count does not.
      - name: SB_COVERAGE_MIN_PERCENT
        value: "{{BEETS_COVERAGE_MIN_PERCENT}}"
    command: ["/bin/sh", "-c"]
    args:
      - |
        cat > /tmp/coverage.py <<'PY'
        """Library-coverage endpoint for the ServiceBay beets template (#2584).

        GET / (any path) answers JSON:

            {"items": 485, "files": 27268, "percent": 1.8,
             "min_percent": 90.0, "status": "behind", "detail": "..."}

        HTTP 200 when the library covers at least `min_percent` of the audio
        files under /music (or while the first scan is still running), 503
        when it is behind or when beets itself does not answer. The status
        code IS the assertion — the registered health check needs no regex.
        """
        import json
        import os
        import threading
        import time
        import urllib.request
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        MUSIC_DIR = "/music"
        # Containers in one pod share a netns (ADR 0007), so beets' own web
        # plugin is on loopback here. Asking beets for the item count keeps
        # this endpoint off the library database's schema.
        STATS_URL = "http://127.0.0.1:8337/stats"
        LISTEN_PORT = 8338
        # A full walk of a large collection is seconds, not minutes, and the
        # answer moves only when the operator adds files — hourly is plenty,
        # and it keeps a health poll from ever touching the disk.
        RESCAN_SECONDS = 3600

        AUDIO_EXTENSIONS = {
            ".mp3", ".flac", ".m4a", ".m4b", ".aac", ".ogg", ".oga", ".opus",
            ".wma", ".wv", ".ape", ".alac", ".aiff", ".aif", ".dsf", ".mpc",
            ".wav",
        }

        _state = {"files": None, "scanned_at": None, "error": None}
        _lock = threading.Lock()


        def min_percent():
            raw = os.environ.get("SB_COVERAGE_MIN_PERCENT", "") or "90"
            try:
                return max(0.0, min(100.0, float(raw)))
            except ValueError:
                return 90.0


        def count_audio_files(root):
            """Audio files under `root`, ignoring dot-files and dot-dirs.

            Syncthing's `.stversions` holds copies of files that are also
            live in the tree; counting them would inflate the denominator
            and make a fully-tagged library look behind.
            """
            total = 0
            for _dirpath, dirnames, filenames in os.walk(root):
                dirnames[:] = [d for d in dirnames if not d.startswith(".")]
                for name in filenames:
                    if name.startswith("."):
                        continue
                    if os.path.splitext(name)[1].lower() in AUDIO_EXTENSIONS:
                        total += 1
            return total


        def rescan_forever():
            while True:
                try:
                    total = count_audio_files(MUSIC_DIR)
                    with _lock:
                        _state["files"] = total
                        _state["scanned_at"] = time.time()
                        _state["error"] = None
                except OSError as exc:
                    with _lock:
                        _state["error"] = str(exc)
                time.sleep(RESCAN_SECONDS)


        def library_items():
            with urllib.request.urlopen(STATS_URL, timeout=5) as resp:
                payload = json.loads(resp.read().decode("utf-8"))
            return int(payload.get("items", 0))


        def coverage_report():
            """Return (http_status, report)."""
            with _lock:
                files = _state["files"]
                scanned_at = _state["scanned_at"]
                scan_error = _state["error"]
            floor = min_percent()
            report = {
                "music_dir": MUSIC_DIR,
                "files": files,
                "scanned_at": scanned_at,
                "min_percent": floor,
            }
            try:
                items = library_items()
            except Exception as exc:
                report["status"] = "unknown"
                report["detail"] = "beets /stats did not answer: %s" % (exc,)
                return 503, report
            report["items"] = items
            if files is None:
                # First scan still running. Bounded and transient, so it is
                # not a red — but it is never silently "ok" either.
                report["status"] = "scanning"
                report["detail"] = scan_error or (
                    "counting the audio files under %s" % (MUSIC_DIR,)
                )
                return 200, report
            if files == 0:
                report["status"] = "ok"
                report["percent"] = 100.0
                report["detail"] = "no audio files under %s — nothing to cover" % (
                    MUSIC_DIR,
                )
                return 200, report
            percent = round(100.0 * items / files, 1)
            report["percent"] = percent
            covered = percent >= floor
            report["status"] = "ok" if covered else "behind"
            report["detail"] = (
                "%d of %d audio files under %s are in the beets library "
                "(%.1f%%, floor %.1f%%)" % (items, files, MUSIC_DIR, percent, floor)
            )
            return (200 if covered else 503), report


        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                status, report = coverage_report()
                body = json.dumps(report).encode("utf-8")
                self.send_response(status)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def log_message(self, fmt, *args):
                # A line per health poll, every 5 minutes, forever. No.
                return


        def main():
            threading.Thread(target=rescan_forever, daemon=True).start()
            ThreadingHTTPServer(("0.0.0.0", LISTEN_PORT), Handler).serve_forever()


        if __name__ == "__main__":
            main()
        PY
        exec python3 -u /tmp/coverage.py
    ports:
      # Container side FIXED at 8338 (the script's LISTEN_PORT); only the
      # host-side publication is operator-configurable, exactly as with the
      # beets UI port above. `hostIP` pins it to the host loopback — unlike
      # the UI, nothing outside this box has a reason to reach it, and
      # ServiceBay's health poller runs on the host.
      - containerPort: 8338
        hostPort: {{BEETS_COVERAGE_PORT}}
        hostIP: 127.0.0.1
    volumeMounts:
      # Read-only: this container counts files, it never touches them.
      - mountPath: /music
        name: music-data
        readOnly: true
  volumes:
  - name: beets-config
    hostPath:
      path: {{DATA_DIR}}/beets/config
      type: DirectoryOrCreate
  - name: music-data
    hostPath:
      path: {{BEETS_MUSIC_PATH}}
      type: DirectoryOrCreate
  - name: audiobooks-data
    hostPath:
      path: {{BEETS_AUDIOBOOKS_PATH}}
      type: DirectoryOrCreate
